# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USART2 PA3/PA2

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.
[include mainsail.cfg]
[include macros.cfg]

[bltouch]
sensor_pin: ^PC14 #Remove ^ if print head crashes into bed, the ^ is for the CR touch a bl touch should work without.
control_pin: PA1
x_offset: -45
y_offset: -5
#z_offset: 0.0

[safe_z_home]
home_xy_position: 155, 115 # Change coordinates to the center of your print bed
speed: 50
z_hop: 15                # Move up 10mm
z_hop_speed: 5

[bed_mesh]
speed: 150
horizontal_move_z: 12
# Bezpieczny start czujnika:
mesh_min: 30, 30
# Maksymalny bezpieczny zasięg czujnika (220 - 45 = 175, dajemy 170 dla marginesu):
mesh_max: 170, 210
probe_count: 6, 6
algorithm: bicubic
adaptive_margin: 5
zero_reference_position: 155, 115

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 128
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 220
position_max: 220
homing_speed: 60

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.640
hold_current: 0.400
interpolate: False
stealthchop_threshold:  0   

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 128
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 220
position_max: 220
homing_speed: 70

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.640
hold_current: 0.400
interpolate: False
stealthchop_threshold:  0

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 4
# endstop_pin: ^PC2
# position_endstop: 0.0
endstop_pin: probe:z_virtual_endstop
position_max: 210
position_min: -5

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999   # Włączamy StealthChop, żeby ruchy osi Z były płynne

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 23.08312057
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
min_temp: 0
max_temp: 250
pressure_advance: 0.04 ;zmienione z 0.045
pressure_advance_smooth_time: 0.04
max_extrude_only_distance: 150.0
max_extrude_cross_section: 5.0

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.780
stealthchop_threshold: 0

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
min_temp: 0
max_temp: 130

[heater_fan controller_fan]
pin: PB15
heater: heater_bed
heater_temp: 45.0

[heater_fan nozzle_cooling_fan]
pin: PC7

[fan]
pin: PC6

[mcu]
#serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_52004D000B50414733303120-if00
serial: /dev/ttyAMA0 ;RPI2
;serial: /dev/ttyS2 ;Rocky
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 350
max_accel: 4000
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5.5

;[input_shaper]
;shaper_freq_x: 38.4  # Przykładowa wartość dla ciężkiego Direct Drive
;shaper_type_x: mzv
;shaper_freq_y: 42.1  # Przykładowa wartość dla bramki Endera 5
;shaper_type_y: mzv

[firmware_retraction]
retract_length: 0.6
# Długość retrakcji w mm (np. 0.5-1.0 dla Direct Drive, 2-5 dla Bowdena)
retract_speed: 35
# Prędkość wycofywania w mm/s
unretract_extra_length: 0
# Dodatkowa długość filamentu przy powrocie (przydatna, jeśli brakuje materiału po retrakcji)
unretract_speed: 20
# Prędkość powrotu filamentu w mm/s

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

######################################################################
#  BigTreeTech TFT TouchScreen emulated 12864 mode
######################################################################

;[display]
;lcd_type: emulated_st7920
;spi_software_miso_pin: PD8 # status led, Virtual MISO
;spi_software_mosi_pin: PD6
;spi_software_sclk_pin: PB9
;en_pin: PB8
;encoder_pins: ^PA10, ^PA9
;click_pin: ^!PA15

;[output_pin beeper]
;pin: PB5

#--------------------------------------------------------------------
# RĘCZNE POZIOMOWANIE GAŁEK (Wspomagane przez BLTouch)
#--------------------------------------------------------------------
[screws_tilt_adjust]
screw1: 50, 35
screw1_name: lewy przod

screw2: 220, 35        # Twoja pozycja: Czujnik nad śrubą
screw2_name: prawy przod

screw3: 220, 210
screw3_name: prawy tyl

screw4: 50, 210
screw4_name: lewy tyl

horizontal_move_z: 10
speed: 150
screw_thread: CW-M4

[exclude_object]


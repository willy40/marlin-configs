[gcode_macro POZYCJA_DO_CZYSZCZENIA]
description: Zjeżdża stołem na dół i wystawia głowicę
gcode:
    # Jeśli osie nie są zbazowane - bazuje przed ruchem
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90 ; Pozycjonowanie absolutne
    M117 Odsuwanie stolu...
    # W Enderze 5: stół leci w dół na 150mm, a głowica jedzie w lewy przód (X10 Y10)
    G1 X10 Y10 Z150 F3000

[gcode_macro TEST_SILNIKOW_XY]
gcode:
    # 1. Pobranie parametrów z konsoli (z domyślnymi wartościami, jeśli nie zostaną podane)
    {% set speed = params.SPEED|default(18000)|int %}
    {% set accel = params.ACCEL|default(3000)|int %}

    # Pobranie maksymalnych wymiarów stołu z konfiguracji drukarki
    {% set x_max = printer.toolhead.axis_maximum.x|float %}
    {% set y_max = printer.toolhead.axis_maximum.y|float %}
    {% set x_mid = x_max / 2 %}
    {% set y_mid = y_max / 2 %}

	M204 S4000

    # 2. Bazowanie (jeśli osie nie są zsynchronizowane)
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    G90 ; Pozycjonowanie absolutne
    M400 ; Czekaj na zatrzymanie ruchów

    G4 P200 ; Pauza na ustabilizowanie napięcia

    # 4. Ruch na środek i ustawienie parametrów testu
    G1 X{x_mid} Y{y_mid} F6000
    M204 S{accel} ; dynamiczne ustawienie akceleracji z parametru ACCEL

    # 5. Pętla wykonująca ruchy 5 razy (od 0 do 4)
    {% for i in range(5) %}
        G1 X{x_max} Y{y_max} F{speed} ; Prawy górny róg
        G1 X0 Y0 F{speed}             ; Lewy dolny róg
        G1 X{x_mid} Y{y_mid} F{speed} ; Powrót na środek
    {% endfor %}

    # ====================================================================
    # DODANA SEKWENCJA: Ruch po obrysie kwadratu (3 powtórzenia w każdą stronę)
    # ====================================================================
    M400

    # Dojazd do pozycji minimalnej (lewy górny róg), skąd ruszy w prawo (zgodnie ze wskazówkami)
    G1 X0 Y{y_max} F{speed}

    # KWADRAT 1: Pętla 3 powtórzeń zgodnie z ruchem wskazówek zegara
    {% for j in range(3) %}
        G1 X{x_max} Y{y_max} F{speed}     ; -> Prawy górny
        G1 X{x_max} Y0 F{speed}           ; -> Prawy dolny
        G1 X0 Y0 F{speed}                 ; -> Lewy dolny
        G1 X0 Y{y_max} F{speed}           ; -> Powrót do lewego górnego
    {% endfor %}
    M400

    # Przejazd z pełną prędkością na przeciwną stronę stołu (Przekątna do Prawego dolnego rogu)
    G1 X{x_max} Y0 F{speed}

    # KWADRAT 2: Pętla 3 powtórzeń przeciwnie do wskazówek zegara
    {% for k in range(3) %}
        G1 X{x_max} Y{y_max} F{speed}     ; -> Prawy górny
        G1 X0 Y{y_max} F{speed}           ; -> Lewy górny
        G1 X0 Y0 F{speed}                 ; -> Lewy dolny
        G1 X{x_max} Y0 F{speed}           ; -> Powrót do prawego dolnego
    {% endfor %}
    M400

    # ====================================================================
    # KONIEC TESTU - POWRÓT DO STANDARDU
    # ====================================================================
    M400 ; Czekaj na zakończenie wszystkich ruchów
	M204 S3000
    G4 P200
    
    G1 X{x_mid} Y{y_mid} F6000 ; Powrót na środek stołu
    M117 Test zakonczony


[gcode_macro SKRYPT_SRUBY]
gcode:
    # 1. Ustawienie temperatury stołu na 60 stopni i czekanie na rozgrzanie
    M117 Rozgrzewanie stolu...
    M190 S70
    
    # 2. Bazowanie wszystkich osi (jeśli nie były zbazowane)
    M117 Bazowanie...
    G28
    
    # 3. Odpalenie pomiaru śrub
    M117 Pomiar srub...
    SCREWS_TILT_CALCULATE
    
    M117 Pomiar zakonczony!

[gcode_macro TEST_WYSOKOSCI]
gcode:
    # 1. Uruchomienie grzania stołu i dyszy w tle
    M117 Rozgrzewanie (Stol: 70, Dysza: 240)...
    M140 S70
    M104 S240
    
    # 2. Czekanie na osiągnięcie zadanych temperatur
    M190 S70
    M109 S240
    
    # 3. Bazowanie wszystkich osi
    M117 Bazowanie osi...
    G28
    
    # 4. Ustawienie pozycjonowania absolutnego
    G90
    
    # 5. Zjazd na środek stołu na wysokość pierwszej warstwy (0.2mm)
    M117 Zjazd na Z=0.2...
    G1 X110 Y110 Z0.2 F3000
    
    M117 Sprawdz kartke pod dysza!

[gcode_macro LUZUJ_XY]
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
    M117 Osie X i Y sa wolne!

#--------------------------------------------------------------------
# AUTOMATYCZNA RETRAKCJA 3MM NA KONIEC / PAUZE / STOP
#--------------------------------------------------------------------

[gcode_macro CANCEL_PRINT]
description: Anulowanie druku z retrakcja 3mm
rename_existing: BASE_CANCEL_PRINT
gcode:
    G91                          # Tryb względny
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-4 F2400               # Szybka retrakcja 3mm
    {% endif %}
    G90                          # Powrót do trybu absolutnego
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    BASE_CANCEL_PRINT

[gcode_macro PAUSE]
description: Pauza z retrakcja 3mm
rename_existing: BASE_PAUSE
gcode:
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G91
      G1 E-4 F2400               # Szybka retrakcja 3mm
      G90
    {% endif %}
    BASE_PAUSE

[gcode_macro RESUME]
description: Wznowienie druku z dopchnieciem 3mm
rename_existing: BASE_RESUME
gcode:
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G91
      G1 E3 F2400                # Dopchnięcie ubytku o 3mm przed startem
      G90
    {% endif %}
    BASE_RESUME

#====================================================================
# SYSTEMOWE MAKRA STARTU, KOŃCA I POZYCJONOWANIA STOŁU
#====================================================================

[gcode_macro START_PRINT]
description: Start z adaptacyjną siatką (exclude_object) i linią czyszczącą
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}

    G21
    G90
    M82
    M220 S100
    M221 S100

    M117 Grzanie w tle...
    M140 S{BED_TEMP}
    M104 S150

    M117 Bazowanie osi...
    G28

    M117 Czekam na stol...
    M190 S{BED_TEMP}

    M117 Probkowanie obszaru modelu...
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1

    M117 Dogrzewanie dyszy...
    M109 S{EXTRUDER_TEMP}

    M117 Czyszczenie dyszy...
    G92 E0
    G1 Z2.0 F3000
    G1 X10.1 Y20 Z0.28 F5000.0
    G1 X10.1 Y200.0 Z0.28 F1500.0 E15
    G1 X10.4 Y200.0 Z0.28 F5000.0
    G1 X10.4 Y20 Z0.28 F1500.0 E30
    G92 E0
    G1 Z2.0 F3000

    M117 Drukuje...

[gcode_macro END_PRINT]
description: Bezpieczne zakończenie wydruku i prezentacja modelu
gcode:
    G91 ; Ustawienie ruchów względnych
    G1 E-3 F2400 ; Szybkie wycofanie 3mm filamentu (czysta dysza)
    G1 Z2.0 F2400 ; Delikatne uniesienie osi Z nad model
    G1 X5 Y5 F3000 ; Krótki wipe (wytarcie dyszy o krawędź)
    G90 ; Powrót do pozycjonowania absolutnego

    # Wyjazd stołu w dół na bezpieczną wysokość i wysunięcie go
    POZYCJA_DO_CZYSZCZENIA

    M106 S0 ; Wyłączenie wentylatora chłodzenia
    M104 S0 ; Wyłączenie grzania dyszy
    M140 S0 ; Wyłączenie grzania stołu
    M84 X Y E ; Odcięcie prądu od silników X, Y oraz E (oś Z trzyma sztywno)
    M117 Wydruk zakonczony!
